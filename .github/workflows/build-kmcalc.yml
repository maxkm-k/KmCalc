                  btnCalc.setOnClickListener {
                      val is3Ph = rbTx3Ph.isChecked
                      val mult = if (is3Ph) sqrt(3.0) else 1.0
                      val kva = etKva.text.toString().toDoubleOrNull() ?: 250.0
                      val rawHv = etHv.text.toString().toDoubleOrNull() ?: 22000.0
                      val hvV = if (rawHv > 0 && rawHv < 150.0) rawHv * 1000.0 else rawHv
                      val lvV = etLv.text.toString().toDoubleOrNull() ?: 415.0
                      val pf = (etPf.text.toString().toDoubleOrNull() ?: 0.85).coerceIn(0.05, 1.0)
                      val zPct = (etZ.text.toString().toDoubleOrNull() ?: 4.5).coerceIn(0.5, 25.0)

                      val hvAmps = if (hvV > 0) (kva * 1000.0) / (mult * hvV) else 0.0
                      val lvAmps = if (lvV > 0) (kva * 1000.0) / (mult * lvV) else 0.0
                      val kw = kva * pf
                      val hpMetric = (kw * 1000.0) / 735.49875
                      val sinPhi = sqrt((1.0 - pf * pf).coerceAtLeast(0.0))
                      val kvar = kva * sinPhi

                      val lvFaultKa = if (lvAmps > 0) (lvAmps * (100.0 / zPct)) / 1000.0 else 0.0
                      val hvFuseA = hvAmps * 1.5
                      val lvFuseA = lvAmps * 1.25
                      val lvFuseSqMm = fuseWireSqMmFromCurrent(lvFuseA)
                      val lvCable = suggestCable(lvAmps * 1.25)

                      tvOut.text = """
                          Transformer: ${formatNum(kva)} kVA (${if (is3Ph) "3-Phase" else "1-Phase"})
                          HV: ${formatNum(hvV)} V (${formatNum(hvV / 1000.0)} kV) | LV: ${formatNum(lvV)} V | %Z: ${formatNum(zPct)}%

