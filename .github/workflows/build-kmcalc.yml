              private fun onCalcKey(key: String) {
                  when (key) {
                      "C" -> {
                          expr = ""
                          tvExpr.text = ""
                          tvResult.text = "0"
                      }
                      "⌫" -> {
                          if (expr.isNotEmpty()) {
                              expr = expr.dropLast(1)
                              tvExpr.text = expr
                          }
                      }
                      "=" -> {
                          try {
                              val valRes = evalMath(expr.replace("×", "*").replace("÷", "/"))
                              tvExpr.text = expr
                              tvResult.text = formatNum(valRes)
                              expr = formatNum(valRes)
                          } catch (_: Exception) {
                              tvResult.text = "Error"
                          }
                      }
                      "±" -> {
                          if (expr.startsWith("-")) expr = expr.removePrefix("-")
                          else if (expr.isNotEmpty()) expr = "-$expr"
                          tvExpr.text = expr
                      }
                      else -> {
                          expr += key
                          tvExpr.text = expr
                      }
                  }
              }

              private fun evalMath(s: String): Double {
                  var pos = -1
                  var ch = 0

                  fun nextChar() {
                      pos++
                      ch = if (pos < s.length) s[pos].code else -1
                  }

                  fun eat(charToEat: Int): Boolean {
                      while (ch == ' '.code) nextChar()
                      if (ch == charToEat) {
                          nextChar()
                          return true
                      }
                      return false
                  }

                  lateinit var parseExpressionFn: () -> Double
                  lateinit var parseTermFn: () -> Double

                  fun parseFactor(): Double {
                      if (eat('+'.code)) return parseFactor()
                      if (eat('-'.code)) return -parseFactor()
                      var x: Double
                      val startPos = pos
                      if (eat('('.code)) {
                          x = parseExpressionFn()
                          eat(')'.code)
                      } else if ((ch in '0'.code..'9'.code) || ch == '.'.code) {
                          while ((ch in '0'.code..'9'.code) || ch == '.'.code) nextChar()
                          x = s.substring(startPos, pos).toDouble()
                      } else {
                          throw RuntimeException("Unexpected char")
                      }
                      if (eat('^'.code)) x = x.pow(parseFactor())
                      return x
                  }

                  fun parseTerm(): Double {
                      var x = parseFactor()
                      while (true) {
                          x = when {
                              eat('*'.code) -> x * parseFactor()
                              eat('/'.code) -> x / parseFactor()
                              eat('%'.code) -> x % parseFactor()
                              else -> return x
                          }
                      }
                  }

                  fun parseExpression(): Double {
                      var x = parseTermFn()
                      while (true) {
                          x = when {
                              eat('+'.code) -> x + parseTermFn()
                              eat('-'.code) -> x - parseTermFn()
                              else -> return x
                          }
                      }
                  }

                  parseTermFn = { parseTerm() }
                  parseExpressionFn = { parseExpression() }

                  nextChar()
                  val result = parseExpression()
                  if (pos < s.length) throw RuntimeException("Trailing chars")
                  return result
              }

              private fun setupUnitsTab() {
                  val spCat = findViewById<Spinner>(R.id.spUnitCat)
                  val spFrom = findViewById<Spinner>(R.id.spUnitFrom)
                  val spTo = findViewById<Spinner>(R.id.spUnitTo)
                  val etVal = findViewById<EditText>(R.id.etUnitVal)
                  val btnConvert = findViewById<Button>(R.id.btnConvertUnit)
                  val tvOut = findViewById<TextView>(R.id.tvUnitOutput)

                  val cats = unitData.keys.toList()
                  spCat.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, cats)

                  fun populateUnits(cat: String) {
                      val names = unitData[cat]?.map { it.first } ?: emptyList()
                      val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, names)
                      spFrom.adapter = adapter
                      spTo.adapter = adapter
                      if (names.size > 1) spTo.setSelection(1)
                  }

                  populateUnits(cats.first())
                  spCat.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p0: AdapterView<*>?, p1: View?, pos: Int, p3: Long) {
                          populateUnits(cats[pos])
                      }
                      override fun onNothingSelected(p0: AdapterView<*>?) {}
                  }

                  btnConvert.setOnClickListener {
                      val input = etVal.text.toString().toDoubleOrNull()
                      if (input == null) {
                          tvOut.text = "Please enter a valid number."
                          return@setOnClickListener
                      }
                      val cat = spCat.selectedItem.toString()
                      val list = unitData[cat] ?: return@setOnClickListener
                      val fromFactor = list[spFrom.selectedItemPosition].second
                      val toFactor = list[spTo.selectedItemPosition].second
                      val converted = (input * fromFactor) / toFactor
                      tvOut.text = "${formatNum(input)} ${spFrom.selectedItem} =\n${formatNum(converted)} ${spTo.selectedItem}"
                  }
              }

              private fun setupMotorsSubTab() {
                  val spMode = findViewById<Spinner>(R.id.spElecMode)
                  val modes = listOf(
                      "From kW (input kW)",
                      "From HP (input HP)",
                      "From kVA & PF (input kVA)",
                      "From V & I (input V & I)"
                  )
                  spMode.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, modes)

                  val etA = findViewById<EditText>(R.id.etElecKnownA)
                  val etV = findViewById<EditText>(R.id.etElecVoltage)
                  val etI = findViewById<EditText>(R.id.etElecCurrent)
                  val etPf = findViewById<EditText>(R.id.etElecPf)
                  val etEff = findViewById<EditText>(R.id.etElecEff)
                  val rbImpHp = findViewById<RadioButton>(R.id.rbImpHp)
                  val rbThreePhase = findViewById<RadioButton>(R.id.rbThreePhase)
                  val btnCalc = findViewById<Button>(R.id.btnCalcElec)
                  val tvOut = findViewById<TextView>(R.id.tvElecOutput)

                  btnCalc.setOnClickListener {
                      val wattsPerHp = if (rbImpHp.isChecked) 745.699872 else 735.49875
                      val isThreePhase = rbThreePhase.isChecked
                      val phaseMult = if (isThreePhase) sqrt(3.0) else 1.0

                      val v = etV.text.toString().toDoubleOrNull() ?: 415.0
                      val pf = (etPf.text.toString().toDoubleOrNull() ?: 0.85).coerceIn(0.01, 1.0)
                      val eff = ((etEff.text.toString().toDoubleOrNull() ?: 90.0) / 100.0).coerceIn(0.01, 1.0)
                      val knownA = etA.text.toString().toDoubleOrNull() ?: 0.0
                      val knownI = etI.text.toString().toDoubleOrNull() ?: 0.0

                      val pOutKw: Double
                      val pInKw: Double

                      when (spMode.selectedItemPosition) {
                          0 -> {
                              pOutKw = knownA
                              pInKw = pOutKw / eff
                          }
                          1 -> {
                              pOutKw = (knownA * wattsPerHp) / 1000.0
                              pInKw = pOutKw / eff
                          }
                          2 -> {
                              val sKva = knownA
                              pOutKw = sKva * pf
                              pInKw = pOutKw / eff
                          }
                          else -> {
                              pOutKw = (phaseMult * v * knownI * pf * eff) / 1000.0
                              pInKw = (phaseMult * v * knownI * pf) / 1000.0
                          }
                      }

                      val hpMetricOut = (pOutKw * 1000.0) / 735.49875
                      val hpImpOut = (pOutKw * 1000.0) / 745.699872
                      val hpSelectedOut = (pOutKw * 1000.0) / wattsPerHp

                      val sKvaOut = pOutKw / pf
                      val sKvaIn = pInKw / pf
                      val sinPhi = sqrt((1.0 - pf * pf).coerceAtLeast(0.0))
                      val qKvarOut = sKvaOut * sinPhi
                      val qKvarIn = sKvaIn * sinPhi

                      val currentOutA = if (v > 0) (sKvaOut * 1000.0) / (phaseMult * v) else 0.0
                      val currentInA = if (v > 0) (sKvaIn * 1000.0) / (phaseMult * v) else 0.0

                      val zOhms = if (currentInA > 0) {
                          if (isThreePhase) (v / sqrt(3.0)) / currentInA else v / currentInA
                      } else 0.0
                      val rOhms = zOhms * pf
                      val xOhms = zOhms * sinPhi
                      val angleDeg = Math.toDegrees(acos(pf))

                      // Motor starting/DOL fuse estimate (~1.5x to 2.5x FLC)
                      val recFuseA = currentInA * 1.5
                      val recFuseSqMm = fuseWireSqMmFromCurrent(recFuseA)
                      val recCable = suggestCable(currentInA * 1.25)

                      val hpLabel = if (rbImpHp.isChecked) "Imp HP (745.7 W)" else "Metric HP (735.5 W)"
                      val sysLabel = if (isThreePhase) "3-Phase" else "1-Phase"

                      tvOut.text = """
                          System: $sysLabel | Basis: $hpLabel
                          Voltage: ${formatNum(v)} V | PF: ${formatNum(pf)} (θ=${formatNum(angleDeg)}°) | Eff: ${formatNum(eff * 100)}%

                          [Power & HP]
                          • Output (P_out): ${formatNum(pOutKw)} kW | Input (P_in): ${formatNum(pInKw)} kW
                          • HP (${hpLabel}): ${formatNum(hpSelectedOut)} HP
                          • Metric HP: ${formatNum(hpMetricOut)} HP | Imp HP: ${formatNum(hpImpOut)} HP
                          • Apparent: ${formatNum(sKvaIn)} kVA (in) / ${formatNum(sKvaOut)} kVA (out)
                          • Reactive: ${formatNum(qKvarIn)} kVAR (in) / ${formatNum(qKvarOut)} kVAR (out)

                          [Currents, Impedance & Protection]
                          • Full-Load Input Current (FLC): ${formatNum(currentInA)} A (Shaft equiv: ${formatNum(currentOutA)} A)
                          • Impedance Z: ${formatNum(zOhms)} Ω | R: ${formatNum(rOhms)} Ω | X: ${formatNum(xOhms)} Ω
                          • Est. Fuse Rating (~1.5×FLC): ${formatNum(recFuseA)} A (~${formatNum(recFuseSqMm)} mm² Cu fuse wire)
                          • Min Cable (1.25×FLC): Cu ${formatNum(recCable.first)} mm² / Al ${formatNum(recCable.second)} mm²
                      """.trimIndent()
                  }
              }

              private fun setupTransformerSubTab() {
                  val rbTx3Ph = findViewById<RadioButton>(R.id.rbTxThreePhase)
                  val etKva = findViewById<EditText>(R.id.etTxKva)
                  val etHv = findViewById<EditText>(R.id.etTxHv)
