                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      swgTable.map { "${it.first} (${it.second} mm)" }
                  )
                  spSqMm.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      cableSizes.map { "${formatNum(it.first)} sq.mm" }
                  )
                  val equipModes = listOf(
                      "General / Feeder (Fuse ~1.25×I)",
                      "Motor DOL / Starter (Fuse ~1.5×I)",
                      "Transformer LV Side (Fuse ~1.25×I)",
                      "Transformer HV Side (Fuse ~1.5×I)"
                  )
                  spEquip.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, equipModes)

                  btnCalc.setOnClickListener {
                      val swgItem = swgTable[spSwg.selectedItemPosition]
                      val swgAreaMm2 = PI * (swgItem.second / 2.0).pow(2.0)

                      val cabItem = cableSizes[spSqMm.selectedItemPosition]
                      val loadAmps = etAmps.text.toString().toDoubleOrNull() ?: 0.0

                      val fuseMult = when (spEquip.selectedItemPosition) {
                          1, 3 -> 1.5
                          else -> 1.25
                      }
                      val targetFuseA = loadAmps * fuseMult
                      val fuseWireMm2 = fuseWireSqMmFromCurrent(targetFuseA)
                      val fuseWireDiaMm = sqrt((fuseWireMm2 * 4.0) / PI)

                      val recCable = suggestCable(loadAmps * 1.25)

                      tvOut.text = """
                          [Selected Size Reference]
                          • ${swgItem.first} (Ø ${formatNum(swgItem.second)} mm): Area ≈ ${formatNum(swgAreaMm2)} mm² | Cu Fusing ≈ ${formatNum(swgItem.third)} A
                          • ${formatNum(cabItem.first)} sq.mm Cable: Cu Rating ≈ ${formatNum(cabItem.second)} A | Al Rating ≈ ${formatNum(cabItem.third)} A

                          [Load Current (${formatNum(loadAmps)} A) & Fuse Sizing]
                          • Mode: ${spEquip.selectedItem}
                          • Recommended Fuse Rating: ${formatNum(targetFuseA)} A
                          • Fuse Wire Area: ${formatNum(fuseWireMm2)} sq.mm (Ø ≈ ${formatNum(fuseWireDiaMm)} mm Cu wire)
                          • Cable Needed for ${formatNum(loadAmps)} A (with 1.25× margin):
                            ↳ Copper: ${formatNum(recCable.first)} sq.mm | Aluminium: ${formatNum(recCable.second)} sq.mm
                      """.trimIndent()
                  }
              }

              // Approximate fusing wire cross-section (sq.mm) for copper wire
              private fun fuseWireSqMmFromCurrent(currentA: Double): Double {
                  if (currentA <= 0.0) return 0.0
                  val kConstant = 80.0
                  val diamMm = (currentA / kConstant).pow(2.0 / 3.0)
                  return PI * (diamMm / 2.0).pow(2.0)
              }

              // Returns Pair(recommendedCuSqMm, recommendedAlSqMm)
              private fun suggestCable(requiredAmps: Double): Pair<Double, Double> {
                  val cu = cableSizes.firstOrNull { it.second >= requiredAmps }?.first ?: cableSizes.last().first
                  val al = cableSizes.firstOrNull { it.third >= requiredAmps }?.first ?: cableSizes.last().first
                  return Pair(cu, al)
              }

              private fun setupDamTab() {
                  val etHead = findViewById<EditText>(R.id.etDamHead)
                  val etFlow = findViewById<EditText>(R.id.etDamFlow)
                  val etEff = findViewById<EditText>(R.id.etDamEff)
                  val etArea = findViewById<EditText>(R.id.etDamArea)
                  val etRise = findViewById<EditText>(R.id.etDamRise)
                  val etForce = findViewById<EditText>(R.id.etDamForce)
                  val btnCalc = findViewById<Button>(R.id.btnCalcDam)
                  val tvOut = findViewById<TextView>(R.id.tvDamOutput)

                  btnCalc.setOnClickListener {
                      val h = etHead.text.toString().toDoubleOrNull() ?: 0.0
                      val q = etFlow.text.toString().toDoubleOrNull() ?: 0.0
                      val eta = ((etEff.text.toString().toDoubleOrNull() ?: 88.0) / 100.0).coerceIn(0.01, 1.0)
                      val areaKm2 = etArea.text.toString().toDoubleOrNull() ?: 0.0
                      val deltaH = etRise.text.toString().toDoubleOrNull() ?: 0.0
                      val baseWidth = etForce.text.toString().toDoubleOrNull() ?: 0.0

                      val g = 9.81
                      val rho = 1000.0
                      val hydraulicKw = (rho * g * q * h) / 1000.0
                      val genKw = hydraulicKw * eta
                      val genMw = genKw / 1000.0
                      val genHpMetric = (genKw * 1000.0) / 735.49875

                      val dailyVolM3 = q * 86400.0
                      val dailyVolMcft = dailyVolM3 / 28316.846592
                      val dailyEnergyMwh = (genKw * 24.0) / 1000.0

                      val areaM2 = areaKm2 * 1e6
                      val storageChangeM3 = areaM2 * deltaH
                      val storageChangeMcft = storageChangeM3 / 28316.846592
                      val storageChangeTmc = storageChangeM3 / 2.8316846592e7

                      val thrustKnPerM = (0.5 * rho * g * h * h) / 1000.0
                      val hCenterFromBase = h / 3.0
                      val overturningMomentKnMPerM = thrustKnPerM * hCenterFromBase

                      val wallAreaPerM = 0.5 * baseWidth * h
                      val selfWeightKnPerM = (wallAreaPerM * 2400.0 * g) / 1000.0
                      val frictionCoeff = 0.7
                      val slidingFos = if (thrustKnPerM > 0) (frictionCoeff * selfWeightKnPerM) / thrustKnPerM else 0.0
                      val overturningFos = if (overturningMomentKnMPerM > 0) (selfWeightKnPerM * (baseWidth / 3.0)) / overturningMomentKnMPerM else 0.0

                      tvOut.text = """
                          [Hydro Power Generation]
                          • Hydraulic Power : ${formatNum(hydraulicKw)} kW (${formatNum(hydraulicKw / 1000.0)} MW)
                          • Generator Output: ${formatNum(genMw)} MW (${formatNum(genKw)} kW)
                          • Metric HP Output: ${formatNum(genHpMetric)} HP
                          • Est. 24h Energy : ${formatNum(dailyEnergyMwh)} MWh (${formatNum(dailyEnergyMwh * 1000.0)} kWh)

                          [Discharge & Reservoir Storage]
                          • Daily Inflow/Outflow: ${formatNum(dailyVolM3)} m³ (${formatNum(dailyVolMcft)} Mcft)
                          • Storage Change (ΔV) : ${formatNum(storageChangeM3)} m³
                            ↳ ${formatNum(storageChangeMcft)} Mcft | ${formatNum(storageChangeTmc)} TMC

                          [Hydrostatic Thrust & Stability (per m run)]
                          • Hydrostatic Thrust (F): ${formatNum(thrustKnPerM)} kN/m
                          • Center of Pressure    : ${formatNum(hCenterFromBase)} m above bed
                          • Overturning Moment (M): ${formatNum(overturningMomentKnMPerM)} kN·m/m
                          • Est. Wall Wt (B=${formatNum(baseWidth)}m): ${formatNum(selfWeightKnPerM)} kN/m
                          • Sliding FoS (μ=0.7)   : ${formatNum(slidingFos)} | Overturning FoS: ${formatNum(overturningFos)}
                      """.trimIndent()
                  }
              }

              private fun formatNum(value: Double): String {
                  if (value.isNaN() || value.isInfinite()) return "0"
                  return String.format(Locale.US, "%.4f", value).trimEnd('0').trimEnd('.')
              }
          }
          EOF

      - name: Generate Gradle Wrapper
        run: |
          cd KmCalc
          gradle wrapper --gradle-version 8.5 --distribution-type all

      - name: Build Debug APK
        run: |
          cd KmCalc
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KmCalc-debug-apk
          path: KmCalc/app/build/outputs/apk/debug/app-debug.apk
