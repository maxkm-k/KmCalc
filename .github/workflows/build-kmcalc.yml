                          • HV Full-Load Current: ${formatNum(hvAmps)} A
                          • LV Full-Load Current: ${formatNum(lvAmps)} A
                          • Active Power @ PF ${formatNum(pf)}: ${formatNum(kw)} kW (${formatNum(hpMetric)} Metric HP)
                          • Reactive Power: ${formatNum(kvar)} kVAR

                          [Fault, Fuse & LV Cable Sizing]
                          • Est. LV Symmetrical Fault (I_sc): ${formatNum(lvFaultKa)} kA
                          • HV Fuse / Dropout Link (~1.5×I_hv): ${formatNum(hvFuseA)} A
                          • LV Fuse Rating (~1.25×I_lv): ${formatNum(lvFuseA)} A (~${formatNum(lvFuseSqMm)} mm² Cu fuse)
                          • Min LV Cable (1.25×I_lv): Cu ${formatNum(lvCable.first)} mm² / Al ${formatNum(lvCable.second)} mm²
                      """.trimIndent()
                  }
              }

