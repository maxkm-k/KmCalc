name: Build KmCalc APK

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK & Project Structure
        run: |
          mkdir -p KmCalc/app/src/main/java/com/kmcalc/app
          mkdir -p KmCalc/app/src/main/res/layout
          mkdir -p KmCalc/app/src/main/res/values
          mkdir -p KmCalc/app/src/main/res/drawable

          cat << 'EOF' > KmCalc/gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > KmCalc/settings.gradle
          rootProject.name = "KmCalc"
          include ':app'
          EOF

          cat << 'EOF' > KmCalc/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > KmCalc/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.kmcalc.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.kmcalc.app"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          cat << 'EOF' > KmCalc/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <application
                  android:allowBackup="true"
                  android:label="KmCalc"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.KmCalc"
                  tools:targetApi="31">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > KmCalc/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">KmCalc</string>
          </resources>
          EOF

          cat << 'EOF' > KmCalc/app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.KmCalc" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">#0F766E</item>
                  <item name="colorSecondary">#1E293B</item>
                  <item name="android:statusBarColor">#0F172A</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > KmCalc/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F172A"
              android:orientation="vertical">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="#1E293B"
                  android:padding="14dp"
                  android:text="KmCalc — Calculator, Units, Electrical &amp; Dam"
                  android:textColor="#F8FAFC"
                  android:textSize="17sp"
                  android:textStyle="bold" />

              <com.google.android.material.tabs.TabLayout
                  android:id="@+id/tabLayout"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="#1E293B"
                  app:tabGravity="fill"
                  app:tabIndicatorColor="#2DD4BF"
                  app:tabMode="scrollable"
                  app:tabSelectedTextColor="#2DD4BF"
                  app:tabTextColor="#94A3B8">

                  <com.google.android.material.tabs.TabItem android:text="Calc" />
                  <com.google.android.material.tabs.TabItem android:text="Units" />
                  <com.google.android.material.tabs.TabItem android:text="Electrical" />
                  <com.google.android.material.tabs.TabItem android:text="Dam" />
              </com.google.android.material.tabs.TabLayout>

              <FrameLayout
                  android:id="@+id/containerFrame"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1">

                  <!-- TAB 0: BASIC CALCULATOR -->
                  <LinearLayout
                      android:id="@+id/panelCalc"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:padding="12dp">

                      <TextView
                          android:id="@+id/tvExpr"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="end"
                          android:padding="6dp"
                          android:text=""
                          android:textColor="#94A3B8"
                          android:textSize="20sp" />

                      <TextView
                          android:id="@+id/tvResult"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="end"
                          android:padding="8dp"
                          android:text="0"
                          android:textColor="#F8FAFC"
                          android:textSize="36sp"
                          android:textStyle="bold" />

                      <GridLayout
                          android:id="@+id/gridCalc"
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="1"
                          android:columnCount="4"
                          android:rowCount="5" />
                  </LinearLayout>

                  <!-- TAB 1: GENERAL UNIT CONVERSIONS -->
                  <ScrollView
                      android:id="@+id/panelUnits"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:padding="14dp"
                      android:visibility="gone">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Category (Weight, Length, Area, Volume)"
                              android:textColor="#CBD5E1"
                              android:textStyle="bold" />

                          <Spinner
                              android:id="@+id/spUnitCat"
                              android:layout_width="match_parent"
                              android:layout_height="48dp"
                              android:layout_marginTop="6dp"
                              android:background="#1E293B" />

                          <EditText
                              android:id="@+id/etUnitVal"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="12dp"
                              android:background="#1E293B"
                              android:hint="Enter value"
                              android:inputType="numberDecimal|numberSigned"
                              android:padding="12dp"
                              android:textColor="#F8FAFC"
                              android:textColorHint="#64748B" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="12dp"
                              android:text="From Unit"
                              android:textColor="#CBD5E1" />

                          <Spinner
                              android:id="@+id/spUnitFrom"
                              android:layout_width="match_parent"
                              android:layout_height="48dp"
                              android:layout_marginTop="4dp"
                              android:background="#1E293B" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="12dp"
                              android:text="To Unit"
                              android:textColor="#CBD5E1" />

                          <Spinner
                              android:id="@+id/spUnitTo"
                              android:layout_width="match_parent"
                              android:layout_height="48dp"
                              android:layout_marginTop="4dp"
                              android:background="#1E293B" />

                          <Button
                              android:id="@+id/btnConvertUnit"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="16dp"
                              android:text="Convert" />

                          <TextView
                              android:id="@+id/tvUnitOutput"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="14dp"
                              android:background="#1E293B"
                              android:padding="14dp"
                              android:text="Result will appear here"
                              android:textColor="#2DD4BF"
                              android:textIsSelectable="true"
                              android:textSize="16sp" />
                      </LinearLayout>
                  </ScrollView>

                  <!-- TAB 2: ELECTRICAL SECTION (MOTORS, TRANSFORMER, CABLE) -->
                  <LinearLayout
                      android:id="@+id/panelElectrical"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:visibility="gone">

                      <com.google.android.material.tabs.TabLayout
                          android:id="@+id/elecSubTabLayout"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="#162032"
                          app:tabGravity="fill"
                          app:tabIndicatorColor="#38BDF8"
                          app:tabMode="fixed"
                          app:tabSelectedTextColor="#38BDF8"
                          app:tabTextColor="#94A3B8">

                          <com.google.android.material.tabs.TabItem android:text="Motors" />
                          <com.google.android.material.tabs.TabItem android:text="Transformer" />
                          <com.google.android.material.tabs.TabItem android:text="Cable" />
                      </com.google.android.material.tabs.TabLayout>

                      <FrameLayout
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="1">

                          <!-- SUB-TAB 2A: MOTORS -->
                          <ScrollView
                              android:id="@+id/subPanelMotors"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:padding="14dp">

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="vertical">

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Motor Calculations (kW, HP, Amps, Voltage, kVA, Fuse)"
                                      android:textColor="#2DD4BF"
                                      android:textSize="15sp"
                                      android:textStyle="bold" />

                                  <RadioGroup
                                      android:id="@+id/rgHpType"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:orientation="horizontal">

                                      <RadioButton
                                          android:id="@+id/rbMetricHp"
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:checked="true"
                                          android:text="Metric HP (735.5 W)"
                                          android:textColor="#E2E8F0" />

                                      <RadioButton
                                          android:id="@+id/rbImpHp"
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:layout_marginStart="12dp"
                                          android:text="Imp HP (745.7 W)"
                                          android:textColor="#E2E8F0" />
                                  </RadioGroup>

                                  <RadioGroup
                                      android:id="@+id/rgPhase"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="4dp"
                                      android:orientation="horizontal">

                                      <RadioButton
                                          android:id="@+id/rbThreePhase"
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:checked="true"
                                          android:text="3-Phase (√3·V·I)"
                                          android:textColor="#E2E8F0" />

                                      <RadioButton
                                          android:id="@+id/rbSinglePhase"
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:layout_marginStart="16dp"
                                          android:text="1-Phase (V·I)"
                                          android:textColor="#E2E8F0" />
                                  </RadioGroup>

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="6dp"
                                      android:text="Solve From"
                                      android:textColor="#CBD5E1" />

                                  <Spinner
                                      android:id="@+id/spElecMode"
                                      android:layout_width="match_parent"
                                      android:layout_height="46dp"
                                      android:layout_marginTop="4dp"
                                      android:background="#1E293B" />

                                  <EditText
                                      android:id="@+id/etElecKnownA"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:background="#1E293B"
                                      android:hint="Power value: kW, HP, or kVA (per mode)"
                                      android:inputType="numberDecimal"
                                      android:padding="12dp"
                                      android:textColor="#F8FAFC"
                                      android:textColorHint="#64748B" />

                                  <EditText
                                      android:id="@+id/etElecVoltage"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:background="#1E293B"
                                      android:hint="Voltage V (default 415 V)"
                                      android:inputType="numberDecimal"
                                      android:padding="12dp"
                                      android:textColor="#F8FAFC"
                                      android:textColorHint="#64748B" />

                                  <EditText
                                      android:id="@+id/etElecCurrent"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:background="#1E293B"
                                      android:hint="Current I in Amps (if mode is From V &amp; I)"
                                      android:inputType="numberDecimal"
                                      android:padding="12dp"
                                      android:textColor="#F8FAFC"
                                      android:textColorHint="#64748B" />

                                  <EditText
                                      android:id="@+id/etElecPf"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:background="#1E293B"
                                      android:hint="Power Factor cos(φ) (0.1 to 1.0, default 0.85)"
                                      android:inputType="numberDecimal"
                                      android:padding="12dp"
                                      android:textColor="#F8FAFC"
                                      android:textColorHint="#64748B" />

                                  <EditText
                                      android:id="@+id/etElecEff"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:background="#1E293B"
                                      android:hint="Efficiency % (1 to 100, default 90)"
                                      android:inputType="numberDecimal"
                                      android:padding="12dp"
                                      android:textColor="#F8FAFC"
                                      android:textColorHint="#64748B" />

                                  <Button
                                      android:id="@+id/btnCalcElec"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="12dp"
                                      android:text="Calculate Motor Quantities" />

                                  <TextView
                                      android:id="@+id/tvElecOutput"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="12dp"
                                      android:background="#1E293B"
                                      android:padding="14dp"
                                      android:text="Enter motor parameters and tap Calculate"
                                      android:textColor="#F8FAFC"
                                      android:textIsSelectable="true"
                                      android:textSize="14sp" />
                              </LinearLayout>
                          </ScrollView>

                          <!-- SUB-TAB 2B: TRANSFORMER -->
                          <ScrollView
                              android:id="@+id/subPanelTransformer"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:padding="14dp"
                              android:visibility="gone">

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="vertical">

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Transformer Calculations (kVA, HV, LV, Amps, Fuse)"
                                      android:textColor="#38BDF8"
                                      android:textSize="15sp"
                                      android:textStyle="bold" />

                                  <RadioGroup
                                      android:id="@+id/rgTxPhase"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:orientation="horizontal">

                                      <RadioButton
                                          android:id="@+id/rbTxThreePhase"
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:checked="true"
                                          android:text="3-Phase"
                                          android:textColor="#E2E8F0" />

                                      <RadioButton
                                          android:id="@+id/rbTxSinglePhase"
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:layout_marginStart="20dp"
                                          android:text="1-Phase"
                                          android:textColor="#E2E8F0" />
                                  </RadioGroup>

                                  <EditText
                                      android:id="@+id/etTxKva"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:background="#1E293B"
                                      android:hint="Transformer Rating in kVA (e.g., 250)"
                                      android:inputType="numberDecimal"
                                      android:padding="12dp"
                                      android:textColor="#F8FAFC"
                                      android:textColorHint="#64748B" />

                                  <EditText
                                      android:id="@+id/etTxHv"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:background="#1E293B"
                                      android:hint="HV Voltage in V or kV (e.g., 22000 or 22)"
                                      android:inputType="numberDecimal"
                                      android:padding="12dp"
                                      android:textColor="#F8FAFC"
                                      android:textColorHint="#64748B" />

                                  <EditText
                                      android:id="@+id/etTxLv"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:background="#1E293B"
                                      android:hint="LV Voltage in V (e.g., 415)"
                                      android:inputType="numberDecimal"
                                      android:padding="12dp"
                                      android:textColor="#F8FAFC"
                                      android:textColorHint="#64748B" />

                                  <EditText
                                      android:id="@+id/etTxPf"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:background="#1E293B"
                                      android:hint="Load Power Factor cos(φ) (default 0.85)"
                                      android:inputType="numberDecimal"
                                      android:padding="12dp"
                                      android:textColor="#F8FAFC"
                                      android:textColorHint="#64748B" />

                                  <EditText
                                      android:id="@+id/etTxZ"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:background="#1E293B"
                                      android:hint="Impedance %Z (default 4.5 for DT)"
                                      android:inputType="numberDecimal"
                                      android:padding="12dp"
                                      android:textColor="#F8FAFC"
                                      android:textColorHint="#64748B" />

                                  <Button
                                      android:id="@+id/btnCalcTx"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="12dp"
                                      android:text="Calculate Transformer Quantities" />

                                  <TextView
                                      android:id="@+id/tvTxOutput"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="12dp"
                                      android:background="#1E293B"
                                      android:padding="14dp"
                                      android:text="Enter kVA, HV, LV to calculate HV/LV Amps, kW, kVAR &amp; Fuse ratings"
                                      android:textColor="#F8FAFC"
                                      android:textIsSelectable="true"
                                      android:textSize="14sp" />
                              </LinearLayout>
                          </ScrollView>

                          <!-- SUB-TAB 2C: CABLE & FUSE -->
                          <ScrollView
                              android:id="@+id/subPanelCable"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:padding="14dp"
                              android:visibility="gone">

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="vertical">

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Cable Rating (Cu / Al), SWG, sq.mm &amp; Fuse Sizing"
                                      android:textColor="#2DD4BF"
                                      android:textSize="15sp"
                                      android:textStyle="bold" />

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:text="Select SWG Size (Reference)"
                                      android:textColor="#CBD5E1" />

                                  <Spinner
                                      android:id="@+id/spSwg"
                                      android:layout_width="match_parent"
                                      android:layout_height="46dp"
                                      android:layout_marginTop="4dp"
                                      android:background="#1E293B" />

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:text="Select Conductor Cross-Section (sq.mm)"
                                      android:textColor="#CBD5E1" />

                                  <Spinner
                                      android:id="@+id/spSqMm"
                                      android:layout_width="match_parent"
                                      android:layout_height="46dp"
                                      android:layout_marginTop="4dp"
                                      android:background="#1E293B" />

                                  <EditText
                                      android:id="@+id/etCableAmps"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:background="#1E293B"
                                      android:hint="Load / Circuit Current in Amps (e.g., 65)"
                                      android:inputType="numberDecimal"
                                      android:padding="12dp"
                                      android:textColor="#F8FAFC"
                                      android:textColorHint="#64748B" />

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp"
                                      android:text="Equipment Type for Fuse Sizing"
                                      android:textColor="#CBD5E1" />

                                  <Spinner
                                      android:id="@+id/spFuseEquip"
                                      android:layout_width="match_parent"
                                      android:layout_height="46dp"
                                      android:layout_marginTop="4dp"
                                      android:background="#1E293B" />

                                  <Button
                                      android:id="@+id/btnCalcCable"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="12dp"
                                      android:text="Calculate Cable &amp; Fuse Ratings" />

                                  <TextView
                                      android:id="@+id/tvCableOutput"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="12dp"
                                      android:background="#1E293B"
                                      android:padding="14dp"
                                      android:text="Copper &amp; Aluminium ampacity, SWG/sq.mm lookup &amp; fuse sq.mm appear here"
                                      android:textColor="#F8FAFC"
                                      android:textIsSelectable="true"
                                      android:textSize="14sp" />
                              </LinearLayout>
                          </ScrollView>
                      </FrameLayout>
                  </LinearLayout>

                  <!-- TAB 3: DAM & HYDROLOGY CALCULATIONS -->
                  <ScrollView
                      android:id="@+id/panelDam"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:padding="14dp"
                      android:visibility="gone">

                      <LinearLayout
